<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokéRogue RL · Endless</title>
<link rel="stylesheet" href="game.css">
</head>
<body>
<header>
  <div class="brand">PokéRogue RL <span>Endless · recording</span></div>
  <div id="runinfo" class="runinfo"></div>
  <div class="hdr-btns">
    <label class="toggle" title="Auto-advance battle text (A)"><input type="checkbox" id="optAuto"> Auto text <kbd>A</kbd></label>
    <select id="optSpeed" title="Text speed">
      <option value="900">Normal</option>
      <option value="450" selected>Fast</option>
      <option value="150">Fastest</option>
    </select>
    <button id="btnNew">New run <kbd>N</kbd></button>
    <button id="btnRuns">Runs <kbd>R</kbd></button>
    <a class="small-link" href="text.html" title="Plain text debug view">text view</a>
  </div>
</header>

<div id="stage">
  <div id="screen">
    <div id="field">
      <img id="arenaBg" class="px" alt="">
      <img id="arenaB" class="px" alt="">
      <img id="arenaA" class="px" alt="">
      <div id="sprites"></div>
      <div id="infos"></div>
      <div id="hud" class="txt"></div>
    </div>
    <div id="ui"></div>
    <div id="title" class="overlay center">
      <div class="title-box txt">
        <div class="big">PokéRogue · Endless</div>
        <div>Press <b>N</b> for a new run, <b>R</b> to resume one.</div>
      </div>
    </div>
  </div>
</div>

<footer>
  <span><kbd>←↑↓→</kbd> move</span><span><kbd>Z</kbd>/<kbd>Enter</kbd> confirm</span><span><kbd>X</kbd>/<kbd>Esc</kbd> back</span>
  <span><kbd>1</kbd>–<kbd>9</kbd> pick</span><span><kbd>Tab</kbd> all legal actions</span><span id="status"></span>
</footer>

<dialog id="dlgNew">
  <form method="dialog" id="formNew">
    <h3>New Endless run</h3>
    <label>Seed <input id="seed" placeholder="blank = random" autocomplete="off"></label>
    <div class="seg">
      <label><input type="radio" name="teamMode" value="random" checked> Random team for seed</label>
      <label><input type="radio" name="teamMode" value="choose"> Choose team</label>
    </div>
    <div id="randomBox" class="box">
      <button type="button" id="btnPreview">Preview team</button>
      <div id="preview" class="muted"></div>
    </div>
    <div id="chooseBox" class="box hidden">
      <div class="picked"><span id="picked"></span><span id="points" class="pts"></span></div>
      <input id="search" placeholder="Search starters… (only affordable ones shown)" autocomplete="off">
      <div id="starterList" class="starter-list"></div>
    </div>
    <div class="dlg-btns">
      <button value="cancel" formnovalidate>Cancel</button>
      <button id="btnStart" value="start" class="primary">Start run</button>
    </div>
  </form>
</dialog>

<dialog id="dlgRuns">
  <h3>Runs <span class="muted">(runs/human)</span></h3>
  <div id="runList"></div>
  <div class="dlg-btns"><button id="btnRunsClose">Close</button></div>
</dialog>

<dialog id="dlgReview">
  <h3 id="reviewTitle">Review</h3>
  <div id="reviewBody" class="review"></div>
  <div class="dlg-btns"><button id="btnReviewClose">Close</button></div>
</dialog>

<script src="game.js"></script>
</body>
</html>
